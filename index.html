.wcap{text-align:center;font-size:13px;color:var(--mut);font-weight:600}

#factx{transition:opacity .4s}
.ptr{transform-origin:50% 20%}.ptr.flick{animation:flick .12s ease-out}@keyframes flick{40%{transform:rotate(-14deg)}}

function crave(i){const m=CR[i];V.mood=i;V.cu=new Set(m.cu||[]);if(m.lo!=null||m.hi!=null){V.lo=m.lo||0;V.hi=m.hi||60};V.adv=!!m.adv;V.late=!!m.late;V.fav=!!m.fav;V.q='';V.unv=V.gm=V.nw=V.try=false;render()}
function clearMood(){V.mood=-1;V.cu=new Set();V.adv=V.late=V.fav=false;render()}

/* ---------- DECIDE ---------- */
function hero(){const n=S.logs.length,cu=new Set(S.logs.map(x=>(byId(x.r)||{}).c).filter(Boolean)).size;
return `<div class="hero"><h2 class="ht"><span>Lapar?</span><span>Let's hunt, Food Hunters!</span></h2><br><div class="lv">${n} meal${n==1?'':'s'} · ${cu} cuisine${cu==1?'':'s'} tried</div>
<div class="fact"><b>Did you know?</b> <span id="factx">${FACTS[FI<0?(FI=Math.floor(Math.random()*FACTS.length)):FI]}</span></div></div>`}
function stats(){const mm=S.logs.filter(l=>l.d.startsWith(td().slice(0,7)));return `<div class="stats"><div><b>${mm.length}</b><span>outings this month</span></div><div><b>$${mm.reduce((a,l)=>a+l.amt,0).toFixed(0)}</b><span>spent this month</span></div><div><b>${all().length}</b><span>spots saved</span></div></div>`}
function decide(){
return `${modeBar()}${hero()}<p class="intro">Answer these 3 questions<br>to use the roulette wheel below</p>
<div class="card bud">${H2('<span class="qn">Step 1:</span>Budget?<span class="qk" id="qk1">✓</span>')}<div class="bv" id="pl"></div>
<small>Min</small><input type="range" min="0" max="60" value="${V.lo}" oninput="V.lo=Math.min(+this.value,V.hi);this.value=V.lo;V.a1=true;res()">
<small>Max</small><input type="range" min="0" max="60" value="${V.hi}" oninput="V.hi=Math.max(+this.value,V.lo);this.value=V.hi;V.a1=true;res()">
<div>${TIERS.map((x,i)=>`<span class="chip ${V.a1&&V.lo==x[1]&&V.hi==x[2]?'on':''}" onclick="tier(${i})">${x[0]}</span>`).join('')}</div></div>
<div class="card">${H2('<span class="qn">Step 2:</span>What’s the vibe today?<span class="qk" id="qk2">✓</span>')}
<div class="mood">${CR.map((c,i)=>`<button class="${V.mood==i?'on':''}" style="--vc:${c.c}" onclick="crave(${i})"><img src="${VIMG[i]}" alt=""><span class="vt"><b>${c.t}</b><em>${c.g}</em><small>${c.d}</small></span></button>`).join('')}</div></div>
<div class="card">${H2('<span class="qn">Step 3:</span>Fine tune it!<span class="qk" id="qk3">✓</span>')}<p class="hint ifn">(if needed)</p>
<input type="text" id="q1" placeholder="Search name, cuisine or area" value="${esc(V.q)}" oninput="V.q=this.value;V.a3=true;const m=$('mq');if(m)m.value=this.value;res()">
<label>Location (none = anywhere in Brunei)</label>
<div>${DIST.map(d=>`<span class="chip ${V.loc.has(d)?'on':''}" onclick="tl('${d}')">${d}</span>`).join('')}</div>
<label>Extras</label>
<div>${[['hrt','Hearted'],['unv','Never been'],['fav','Crew faves'],['try','To try'],['late','Open past 12am'],['gm','Hidden gems'],['nw','New openings']].map(([k,l])=>`<span class="chip ${V[k]?'on':''}" onclick="V.${k}=!V.${k};V.a3=true;render()">${l}</span>`).join('')}<span class="chip done ${V.a3?'on':''}" onclick="V.a3=true;render()">✓ All set</span></div>

function vines(){if(!$('fldefs'))document.body.insertAdjacentHTML('afterbegin',FLDEFS.replace('<svg ','<svg id="fldefs" '));document.querySelectorAll('#app .card').forEach((c,i)=>{if(!c.querySelector(':scope>.vine'))c.insertAdjacentHTML('beforeend',`<span class="vine" aria-hidden="true">${CORNER[i%3]}</span>`)})}
const RM=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const GSTAR=c=>`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="13" fill="url(#sglow)"/><path fill="${c||'#fff'}" d="M20 1C20.8 14 26 19.2 39 20 26 20.8 20.8 26 20 39 19.2 26 14 20.8 1 20 14 19.2 19.2 14 20 1Z"/></svg>`,GDOT='<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="url(#sglow)"/><circle cx="20" cy="20" r="4.5" fill="#fff"/></svg>';
/* sparkles that whirl around the rim while the wheel spins */
function wSpark(){const b=document.querySelector('.wbox');if(!b||RM())return;const s=document.createElement('span'),R=b.offsetWidth/2,th=Math.random()*Math.PI*2,r=R*(.9+Math.random()*.2),sw=1+Math.random()*1.2,z=11+Math.random()*12;
s.className='wsp';s.innerHTML=Math.random()<.3?GDOT:GSTAR(['#fff','#ffe7a3','#ffd1e6'][Math.floor(Math.random()*3)]);s.style.cssText=`width:${z}px;height:${z}px;margin:${-z/2}px 0 0 ${-z/2}px`;b.appendChild(s);
const fr=[];for(let k=0;k<=6;k++){const t=k/6,a=th+sw*t,rr=r+t*R*.22;fr.push({transform:`translate(${Math.cos(a)*rr}px,${Math.sin(a)*rr}px) scale(${1-t*.5}) rotate(${t*240}deg)`,opacity:k==0?0:k<4?1:1-(t-.5)*1.8})}
s.animate(fr,{duration:1000+Math.random()*500,easing:'ease-out'}).finished.then(()=>s.remove(),()=>s.remove())}
/* sparkles burst from the pointer, then a paper plane carries the pick to you */
function reveal(r){const wb=$('wb'),pt=document.querySelector('.ptr');W.rev=true;if(wb)wb.disabled=true;if(!pt||RM()){showNote(r);return}
const q=pt.getBoundingClientRect(),tx=q.left+q.width/2,ty=q.top+q.height*.4;
for(let k=0;k<12;k++){const s=document.createElement('span');s.className='wsp fixed';s.innerHTML=GSTAR(k%2?'#ffe7a3':'#fff');const z=8+Math.random()*9,a=Math.random()*Math.PI*2,d=22+Math.random()*34;s.style.cssText=`left:${tx}px;top:${ty}px;width:${z}px;height:${z}px;margin:${-z/2}px 0 0 ${-z/2}px`;document.body.appendChild(s);
s.animate([{transform:'scale(.2)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(1) rotate(160deg)`,opacity:0}],{duration:700,easing:'ease-out'}).finished.then(()=>s.remove(),()=>s.remove())}
setTimeout(()=>plane(tx,ty,r),250)}
function plane(sx,sy,r){const p=document.createElement('div');p.className='plane';p.innerHTML='<svg viewBox="0 0 64 40"><path d="M2 21 62 2 27 25z" fill="#fff"/><path d="M27 25 62 2 35 38z" fill="#ece6f7"/><path d="m27 25 8 13-5-10z" fill="#cfc6e6"/></svg>';document.body.appendChild(p);
const ex=innerWidth/2,ey=innerHeight*.45,cx=sx+(ex-sx)*.3+90,cy=Math.min(sy,ey)-150,N=14,fr=[];
for(let k=0;k<=N;k++){const t=k/N,x=(1-t)*(1-t)*sx+2*(1-t)*t*cx+t*t*ex,y=(1-t)*(1-t)*sy+2*(1-t)*t*cy+t*t*ey,dx=2*(1-t)*(cx-sx)+2*t*(ex-cx),dy=2*(1-t)*(cy-sy)+2*t*(ey-cy),a=Math.atan2(dy,dx)*180/Math.PI+16;
fr.push({transform:`translate(${x}px,${y}px) rotate(${a}deg) scale(${.6+t*1.1})`})}
p.animate(fr,{duration:1400,easing:'ease-in-out',fill:'forwards'}).finished.then(()=>{p.animate([{opacity:1},{opacity:0,transform:fr[N].transform+' scale(1.6)'}],{duration:250,fill:'forwards'}).finished.then(()=>p.remove(),()=>p.remove());showNote(r)},()=>p.remove())}
function showNote(r){W.rev=false;updSpin();const o=document.createElement('div');o.className='paperbg';
o.innerHTML=`<div class="paper" role="dialog" aria-label="The wheel has spoken"><p class="pk1">✨ The wheel has spoken ✨</p><b>${esc(r.n)}</b><small>${esc(r.c)}${r.a?' · '+esc(r.a):''} · ${pr(r)}${r.note?' · '+esc(r.note):''}</small><button class="btn" onclick="this.closest('.paperbg').remove();goLog('${r.id}')">We went! Log it</button><button class="btn s" onclick="this.closest('.paperbg').remove()">Yay!</button></div>`;
o.addEventListener('click',e=>{if(e.target===o)o.remove()});document.body.appendChild(o);hearts(o);confetti()}
function aftMatch(){return all().filter(r=>isAft(r)&&(!r.p||r.p<=V.ahi)&&(V.loc.has('Miri')||!hasT(r,'miri'))&&(!V.ru||hasT(r,'reuse'))&&(!V.ch||hasT(r,'chill'))&&(!V.ak.size||V.ak.has(r.c=='Café'?'Coffee':r.c)))}
function sweet(){const m=aftMatch(),sl=$('slot');if(!m.length){sl.innerHTML='<span>No sweet spots match. Add some in Discover!</span>';return}
const r=m[Math.floor(Math.random()*m.length)],fast=matchMedia('(prefers-reduced-motion:reduce)').matches;$('sb').disabled=true;$('sres').innerHTML='';sl.classList.add('go');
let k=0;const t=setInterval(()=>{sl.innerHTML=`<span>${esc(m[k++%m.length].n)}</span>`},90);
setTimeout(()=>{clearInterval(t);sl.classList.remove('go');sl.innerHTML=`<span>${esc(r.n)}</span>`;$('sb').disabled=false;confetti();
$('sres').innerHTML=`<p class="hint" style="text-align:center;margin-top:8px">${esc(r.c)}${r.a?' · '+esc(r.a):''} · ${pr(r)}${hasT(r,'reuse')?' · bring a reusable cup for a discount':''}</p><button class="btn s" onclick="goLog('${r.id}')">Log it</button>`},fast?200:1800)}
function goLog(id){V.pre=id;go('log')}

/* ---------- SPEND ---------- */
const PC=['#3a93cf','#e0558c','#8a6cc9','#c98216','#2a9d80'],OTH='#9aa3b8';
function pie(m){const t={};m.forEach(l=>{const r=byId(l.r)||{c:'Other'},k=isAft(r)?'Coffee, tea & dessert':r.c;t[k]=(t[k]||0)+l.amt});
let e=Object.entries(t).sort((a,b)=>b[1]-a[1]);if(e.length>5){const o=e.slice(4).reduce((s,x)=>s+x[1],0);e=e.slice(0,4).concat([['Other',o]])}
const tot=e.reduce((s,x)=>s+x[1],0);if(!tot)return '';
let a0=-Math.PI/2,paths='';const R=80,r0=50,cx=85,cy=85;
const col=(k,i)=>k=='Other'?OTH:PC[i];
e.forEach(([k,v],i)=>{const a1=a0+v/tot*2*Math.PI,L=a1-a0>Math.PI?1:0,p=(ang,rr)=>[cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr].map(z=>z.toFixed(2)).join(' ');
const d=e.length==1?`M${cx} ${cy-R}A${R} ${R} 0 1 1 ${cx-.01} ${cy-R}L${cx-.01} ${cy-r0}A${r0} ${r0} 0 1 0 ${cx} ${cy-r0}Z`:`M${p(a0,R)}A${R} ${R} 0 ${L} 1 ${p(a1,R)}L${p(a1,r0)}A${r0} ${r0} 0 ${L} 0 ${p(a0,r0)}Z`;
paths+=`<path d="${d}" fill="${col(k,i)}" stroke="var(--card)" stroke-width="2"><title>${esc(k)}: ${money(v)} (${Math.round(v/tot*100)}%)</title></path>`;a0=a1});
return `<div class="pie"><svg viewBox="0 0 170 170" role="img" aria-label="Spending by cuisine">${paths}<text x="85" y="82" text-anchor="middle" font-size="11" fill="var(--mut)" font-weight="700">Total</text><text x="85" y="99" text-anchor="middle" font-size="15" fill="var(--ink)" font-weight="800">$${tot.toFixed(0)}</text></svg>
<div class="leg">${e.map(([k,v],i)=>`<div><i style="background:${col(k,i)}"></i>${esc(k)}<b>${money(v)} · ${Math.round(v/tot*100)}%</b></div>`).join('')}</div></div>`}
function log(){const m=S.logs.filter(l=>l.d.startsWith(V.mon)),tot=m.reduce((a,l)=>a+l.amt,0),cnt={};
const at=m.filter(l=>isAft(byId(l.r)||{})).reduce((a,l)=>a+l.amt,0);
S.logs.forEach(l=>cnt[l.r]=(cnt[l.r]||0)+1);
const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
const opt=r=>`<option value="${r.id}" ${r.id==V.pre?'selected':''}>${esc(r.n)}</option>`;
return `${modeBar()}<div class="card">${H2('Log a meal')}<p class="hint">Record what you spent so the summary, trail and calendar stay up to date.</p>
<label>Where</label><select id="lr"><optgroup label="Lunch">${all().filter(r=>!isAft(r)).map(opt).join('')}</optgroup><optgroup label="Coffee, tea & dessert">${all().filter(isAft).map(opt).join('')}</optgroup></select>
<label>Date</label><input type="date" id="ld" value="${td()}">
<label>Total spent (BND)</label><input type="number" id="la" step="0.01" min="0" inputmode="decimal">
<label>Note (optional)</label><input type="text" id="ln" placeholder="Best sambal ever">
<button class="btn" onclick="addLog()">Save it</button></div>
${stats()}<div class="card">${H2('Monthly summary')}<input type="month" value="${V.mon}" onchange="V.mon=this.value;render()">
<div class="big">${money(tot)}</div><p class="hint" style="text-align:center">${m.length} outing(s)${m.length?' · '+money(tot/8)+' per person · lunch '+money(tot-at)+' · sweets '+money(at):''}</p>
${pie(m)||'<p class="hint" style="text-align:center">Log a meal to see the pie chart.</p>'}
${m.sort((a,b)=>a.d<b.d?-1:1).map(l=>`<div class="row"><span>${l.d.slice(8)}/${l.d.slice(5,7)} · ${esc(rn(l.r))}<br><small>${esc(l.note||'')}</small></span><span style="white-space:nowrap">${money(l.amt)} <button class="btn s" onclick="delLog('${l.id}')">Remove</button></span></div>`).join('')}</div>
<div class="card">${H2('Visits per restaurant')}${top.map(([id,n])=>`<div class="row"><span>${esc(rn(id))}</span><b>${n}×</b></div>`).join('')||'<small>No visits yet</small>'}</div>`}
function addLog(){const a=parseFloat($('la').value);if(isNaN(a)||!$('ld').value){alert('Add a date and amount first.');return}
const o={id:uid('l'),r:$('lr').value,d:$('ld').value,amt:a,note:$('ln').value};V.pre='';V.mon=o.d.slice(0,7);document.activeElement&&document.activeElement.blur();addItem('logs',o);render();confetti()}

/* ---------- TRAIL ---------- */
function map(){const L=[...S.logs].sort((a,b)=>a.d<b.d?-1:1);

const H=L.length*90+60;let pts=L.map((l,i)=>[i%2?230:70,50+i*90]);
let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],my=(a[1]+b[1])/2;d+=` C${a[0]} ${my},${b[0]} ${my},${b[0]} ${b[1]}`}
const nodes=L.map((l,i)=>{const [x,y]=pts[i],r=x<150,tx=r?x+24:x-24,an=r?'start':'end',nm=rn(l.r),sw=isAft(byId(l.r)||{});

const norm=s=>String(s||'').trim().toLowerCase();
const findP=s=>{const n=norm(s).replace(/^(dr|ms|mr|mrs)\.?\s+/,'');return P.find(p=>norm(p)==norm(s))||P.find(p=>norm(p).replace(/^ms\s+/,'')==n)||P.find(p=>n&&(n.startsWith(norm(p).replace(/^ms\s+/,''))||norm(p).replace(/^ms\s+/,'').startsWith(n)))};
const RIPAS_DRIVERS=['Ms Fii','Nadiah','Abraham'];
const isRipas=l=>/ripas/i.test(l||'');
const canDrive=x=>x.p!='Haziq'&&(!isRipas(x.l)||RIPAS_DRIVERS.includes(x.p));
const offDuty=x=>/^(away|on call)/i.test(x.l||'');
function rota(){const E=S.rota.filter(x=>x.d==V.day),hz=E.find(x=>x.p=='Haziq'),
dr=hz&&!offDuty(hz)?E.filter(x=>x.p!='Haziq'&&!offDuty(x)&&norm(x.l)==norm(hz.l)&&canDrive(x)):[];
