*{box-sizing:border-box}html,body{margin:0}
body{background:linear-gradient(170deg,var(--bg) 0%,var(--bg2) 55%,var(--bg) 100%) fixed;color:var(--ink);font:500 15.5px/1.5 'Quicksand',system-ui,sans-serif;padding-bottom:96px;min-height:100vh;overflow-x:hidden}

@keyframes beat{0%,100%{transform:scale(1)}10%{transform:scale(1.12)}20%{transform:scale(1)}30%{transform:scale(1.08)}40%{transform:scale(1)}}

.tools{display:flex;gap:6px;flex:none;margin-left:auto}

.hero{position:relative;overflow:hidden;margin:16px 0 10px;padding:22px 18px 18px;border-radius:28px;background:linear-gradient(135deg,var(--pink),var(--lav) 55%,var(--blue));box-shadow:var(--sh)}

function hasLocal(){return LOCAL.logs.length||LOCAL.rota.length||LOCAL.cust.length||(LOCAL.rate||[]).length||Object.keys(LOCAL.heart||{}).length}
async function migrate(){const b=$('mgb');if(b){b.disabled=true;b.innerHTML='<span class="load"></span>Copying…'}
try{for(const k of ['logs','rota','cust','rate'])for(const o of (LOCAL[k]||[])){const id=o.id||uid(k[0]);await DB.collection(CO[k]).doc(id).set(Object.assign({},o,{id}))}
for(const id in LOCAL.gem)await DB.collection('gems').doc(id).set({g:!!LOCAL.gem[id]});for(const id in (LOCAL.heart||{}))await DB.collection('hearts').doc(id).set({h:!!LOCAL.heart[id]});
MIG=true;try{localStorage.setItem('fh_mig','1')}catch(e){}toast('Your saved entries are now in the group log.');confetti()}catch(e){dbErr(e)}render()}
function skipMig(){MIG=true;try{localStorage.setItem('fh_mig','1')}catch(e){}render()}
function modeBar(){const m=MODE=='live'?(RO?'<span class="dot o"></span>Group log · view only':'<span class="dot"></span>'+(CREW?'Synced (Live)':'Shared group log · live for all 8 of you')):MODE=='local'?'<span class="dot o"></span>'+(fbOn()?'Not synced · saved on this phone':'Saved on this phone'):MODE=='error'?'<span class="dot o"></span>Group log offline · reconnecting':'<span class="load"></span>Connecting to the group log…';
const m2=/^<span class="dot/.test(m)?m+m.slice(0,m.indexOf('</span>')+7):m;
return `<div class="mode">${m2}</div>${MODE=='live'&&!RO&&!MIG&&hasLocal()?`<div class="card">${H2('Bring your old entries along?')}<p class="hint">This phone has ${LOCAL.logs.length} meal(s), ${LOCAL.rota.length} rota entr${LOCAL.rota.length==1?'y':'ies'} and ${LOCAL.cust.length} spot(s) saved from before the group log. Copy them in so everyone can see them?</p><button class="btn" id="mgb" onclick="migrate()">Copy them to the group log</button><button class="btn s" style="margin-top:10px" onclick="skipMig()">No thanks</button></div>`:''}`}

for(let k=0;k<12;k++){const s=document.createElement('span');s.className='wsp fixed';s.innerHTML=GSTAR(k%2?'#ffe7a3':'#fff');const z=8+Math.random()*9,a=Math.random()*Math.PI*2,d=22+Math.random()*34;s.style.cssText=`left:${tx}px;top:${ty}px;width:${z}px;height:${z}px;margin:${-z/2}px 0 0 ${-z/2}px`;document.body.appendChild(s);
s.animate([{transform:'scale(.2)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(1) rotate(160deg)`,opacity:0}],{duration:700,easing:'ease-out'}).finished.then(()=>s.remove(),()=>s.remove())}

function plane(sx,sy,r){const p=document.createElement('div');p.className='plane';p.innerHTML='<svg viewBox="0 0 64 40"><path d="M2 21 62 2 27 25z" fill="#fff"/><path d="M27 25 62 2 35 38z" fill="#ece6f7"/><path d="m27 25 8 13-5-10z" fill="#cfc6e6"/></svg>';document.body.appendChild(p);

function sum(E,hz,dr){

${G.map(g=>`<div class="row"><span>${esc(g.l)}<br><span class="avs" style="justify-content:flex-start;margin-top:4px">${g.p.map(p=>av(p,26)).join('')}</span><br><small>${g.d.length?'Drivers: '+g.d.map(esc).join(', '):'No driver here'}</small></span><b>${g.cars} car${g.cars==1?'':'s'}${g.stuck?`<br><small style="color:var(--pk)">${g.stuck} need a lift</small>`:''}</b></div>`).join('')}
${hz&&dr.length?`<div class="row"><span>Haziq rides with</span><b>${av(dr[0].p,28)}${esc(dr[0].p)}</b></div>`:''}

<div class="card">${H2('Rota summary')}<p class="hint">${S.rota.length} entries across ${days} day(s)</p>

function upRota(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const L=[];r.result.split(/\r?\n/).forEach(ln=>{const [p,d0,...l]=ln.split(',');if(!d0||!l.length)return;const d=fixD(d0);
const nm=findP(p);if(!nm||!d)return;L.push({id:uid('r'),p:nm,d,l:l.join(',').trim()})});putRota(L).then(()=>toast(L.length+' rota entries added'))};r.readAsText(f)}
function fixD(d){d=String(d||'').trim();const m=d.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)d=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return /^\d{4}-\d\d-\d\d$/.test(d)?d:''}

const FACTS=['Kelupis is a Bruneian rice snack steamed in a leaf wrapper.','Kuih cincin, a ring-shaped fried biscuit, is a favourite at Bruneian Hari Raya open houses.','Pandan leaves give many Southeast Asian desserts their green colour and vanilla-like scent.','Belacan is made by fermenting tiny shrimp with salt, then drying it into blocks.','Bubble tea was invented in Taiwan in the 1980s.','Wasabi served in most restaurants is actually horseradish coloured green.','Chocolate was drunk as a bitter, spiced drink for centuries before it became a sweet treat.','Croissants as we know them were popularised in Paris, inspired by the Austrian kipferl.','Kimchi is often fermented for weeks, and Korean households sometimes keep a separate kimchi fridge.','Pho is traditionally eaten for breakfast in Vietnam.','Honey stored properly can stay edible for an extremely long time.','A single vanilla pod comes from an orchid flower that is often pollinated by hand.','Satay is usually served with peanut sauce, cucumber and onion.','Bingsu, Korean shaved-ice dessert, is traditionally topped with sweet red beans.','Ambuyat, Brunei\'s national dish, is a sticky starch made from the sago palm.','Sambal belacan blends chilli with fermented shrimp paste.','Nasi katok is a beloved Brunei budget meal: rice, fried chicken and sambal.','Chilli heat is measured in Scoville units.','Kuih are bite-sized sweet snacks enjoyed across Brunei and Malaysia.','Tempura reached Japan through Portuguese traders centuries ago.','Teh tarik is "pulled" between two cups to cool it and make it frothy.','Mont Blanc dessert is named after the snowy Alpine peak.'];
